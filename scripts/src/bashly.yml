name: cdev
help: Creates a new isolated developmenet environment
version: 0.1.0

commands:
- name: init
  help: create new development project

  args:
  - name: project_name
    required: true
    help: Unique name of the development environment

  flags:
  - arg: git_url
    long: --source
    short: -s
    help: Git source to hydrate developmenet environment
