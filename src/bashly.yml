name: cdev
help: >
  CDEV is a development workflow tools designed to work with nix and containerization.
version: 0.1.0

dependencies:
  containerization:
    command: ['container']
    help: 'CDEV requires one of the following containerization tools: "container (apple)"'
  json_parser:
    command: ['jq']
    help: 'jq is required to parse container information'
commands:
- name: project
  help: >
    CDEV projects are container volumes for your project source code.
  commands:
  - name: create
    filename: commands/project/create.sh
    help: >
      Creates a new container volume to persist project source code. The volume
      can be initialized as empty for new projects are hydrated from an existing
      git repo.
    flags:
    - arg: project_name
      long: --project_name
      short: -p
      required: true
      help: >
        Unique name for the project volume.
    - arg: git_url
      long: --source
      short: -s
      help: >
        Optional git uri for volume hydration. This will create a temporary container
        to perform the git clone. The host ssh socket will be forwarded to this container.
        For password protected identity files add unload them the ssh agent using "ssh-add"
    - arg: git_branch
      long: --branch
      short: -b
      needs:
        - --source
      help: >
        Optional git branch for volume hydration. Requires --source to be set.

- name: env
  help: Manage development environment containers
  commands:
  - name: build 
    filename: commands/env/build.sh
    help: Build a development image from nix flake
    flags:
    - arg: image_name
      long: --image_name
      short: -i
      required: true
      help: Image to create enviroment from

  - name: start
    filename: commands/env/start.sh
    help: Start development container
    flags:
    - arg: env_name
      long: --env_name
      short: -e
      required: true
      help: Unique name of the development environment
    - arg: project_name
      long: --project_name
      short: -p
      required: true
      help: Name of project to attach to the environment
    - arg: image_name
      long: --image_name
      short: -i
      required: true
      help: Image to create environment from
    - long: --no-ssh-socket
      negatable: true
      help: > 
        Disables forwarding the host ssh socket to the container. This strengthens
        security, but hinders most development work flows. Useful for test/build
        containers that don't need access to remote source code.

  - name: connect
    filename: commands/env/connect.sh
    help: Open ssh connection development container
    flags:
    - arg: env_name
      long: --env_name
      short: -e
      required: true